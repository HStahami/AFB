# SonarQube Scanner Configuration (CI / Manual scanner fallback)
sonar.projectKey=HStahami_AFB
sonar.organization=hstahami
sonar.projectName=Alarabia Fi Buyutikum

# Analysis scope: only analyze primary application sources
sonar.sources=backend/app,frontend/src

# File exclusions: completely exclude Vercel deployment mirror (api/), build artifacts, dependencies, and scripts
sonar.exclusions=api/**,api/**/*,frontend/dist/**,frontend/dist/**/*,frontend/node_modules/**,frontend/node_modules/**/*,backend/venv/**,backend/venv/**/*,scripts/**,scripts/**/*,**/__pycache__/**,backend/tests/**

# Duplication (CPD) exclusions
sonar.cpd.exclusions=api/**,api/**/*,scripts/**,scripts/**/*,frontend/dist/**,backend/venv/**

# Character encoding
sonar.sourceEncoding=UTF-8

# Python version
sonar.python.version=3.11,3.12
