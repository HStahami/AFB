sonar.projectKey=HStahami_AFB
sonar.organization=hstahami
sonar.projectName=Alarabia Fi Buyutikum

# Analysis scope
sonar.sources=backend/app,frontend/src

# File exclusions
sonar.exclusions=frontend/dist/**,frontend/node_modules/**,backend/venv/**,scripts/**,**/__pycache__/**,backend/tests/**

# Duplication (CPD) exclusions - Exclude Vercel deployment mirror (api/) and scripts from duplicate code metrics
sonar.cpd.exclusions=api/**,scripts/**,frontend/dist/**,backend/venv/**

# Character encoding
sonar.sourceEncoding=UTF-8
